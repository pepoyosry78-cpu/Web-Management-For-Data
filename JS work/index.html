<!DOCTYPE html>
<html>

<head>
    <title>Pepo</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
    <div class="head">
        <h2>Crud</h2>
        <p>Product Management System</p>
    </div>
    <div class="input">
        <input type="text" id="Title" placeholder="Enter product name">
        <div class="price">
        <input onkeyup="CalcTotal()" type="number" id="Price" placeholder="Enter product price">
        <input onkeyup="CalcTotal()" type="number" id="Taxes" placeholder="Enter product taxes">
        <input onkeyup="CalcTotal()" type="number" id="ADS" placeholder="Enter product ADS">
        <input onkeyup="CalcTotal()" type="number" id="Discount" placeholder="Enter product discount">
        <small id="Total"></small>
        </div>
        <input type="number" id="Count" placeholder="Enter product count">
        <input type="text" id="category" placeholder="Enter product category">
        <button type="submit" id="create">Create</button>
    </div>
    <div class="output">
        <div class="SearchBlock">
            <input type="text" id="search" placeholder="Search">
            <div class="searchType">
                <button class="btn" id="searchTitle">Search By Title</button>
                <button class="btn" id="searchCategory">Search By Category</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Taxes</th>
                    <th>ADS</th>
                    <th>Discount</th>
                    <th>Total</th>
                    <th>Category</th>
                    <th>Update</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td id="tableTitle">phone</td>
                    <td id="tablePrice">2250</td>
                    <td id="tableTaxes">100</td>
                    <td id="tableADS">50</td>
                    <td id="tableDiscount">20</td>
                    <td id="tableTotal">2430</td>
                    <td id="tableCategory">Electronics</td>
                    <td><button class="btn" id="update">Update</button></td>
                    <td><button class="btn" id="delete">Delete</button></td>
                </tr>
            </tbody>
    </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
